  <path d="M 14.79 49.12 L 13.1 39.15 L 22.36 43.21 Z" fill="#8FA6FF"/>
  <rect x="22.4" y="25.5" width="4.6" height="13" rx="2.3" fill="#8FA6FF"/>
  <rect x="29.7" y="21" width="4.6" height="22" rx="2.3" fill="#8FA6FF"/>
  <rect x="37" y="25.5" width="4.6" height="13" rx="2.3" fill="#8FA6FF"/>
